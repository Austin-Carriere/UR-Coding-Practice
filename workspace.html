<!doctype html>
<html lang="en-Us">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="images/urban-rescue-logo.png" />
    <title>Urban Rescue Code Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
<link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/blockly/blockly.min.js"></script>
    <script type="module" defer src="scripts/canvasScript.js"></script>
  </head>
  <body>
    <header class="header">
      <a href="index.html"><img
        height="70px"
        src="images/urban-rescue-logo.png"
        alt="Urban Rescue Logo"
        href="index.html"
      /></a>
      
    </header>
    <div class="main">
    <div id="blocklyDiv" style="width:95vw;height:100%; margin-right: 5vw;"></div>
      <div class="sidePanel">
        <div class= "panelContainer" id = "panelContainer">
          <button class="panelButton" id="panelButton">
            <img width="87px" draggable="false" class="arrowPopup" id="panelArrow" src="images/Arrow.svg">
          </button>
          <div class="panel">
            <div class="CanvasContainer">
              <canvas id = "canvas" class="canvasPopup"></canvas>

            <div class = "canvasOverlayContainer">
            <div class="canvasOverlay">
              <div id ="CarChange" class="menu">
                <h1 class="CarChangeTitle">Car Changer</h1>
                  <img id="CarPreview" class="CarPreview" height="40%" src="images/Cars/Black_Car1.png">
                  <div class="Changer">
                    <button id="LeftArrowButtonColor" class="ArrowButton">
                      <img class="CarChangeArrow" width="170px" src="images/LeftArrowUR.png">
                    </button>
                    <div class="CarCostumeText">Black</div>
                    <button id="RightArrowButtonColor" class="ArrowButton">
                      <img class="CarChangeArrow" width="170px" src = "images/RightArrowUR.png"> 
                    </button>
                  </div>

                  <div class="Changer">
                    <button id="LeftArrowButtonType" class="ArrowButton">
                      <img class="CarChangeArrow" width="170px" src="images/LeftArrowUR.png">
                    </button>
                    <div id ="CarTypeText" class="CarCostumeText">Corvette</div>
                    <button id="RightArrowButtonType" class="ArrowButton">
                      <img class="CarChangeArrow" width="170px" src = "images/RightArrowUR.png"> 
                    </button>
                  </div>

                  <button class="CarCostumeConfirmButton">Confirm</button>
                  </div>
              <div id="levelSelector" class="menu">
                <div class="CarChangeTitle">Levels</div>
                <div class="levelsContainer">          
                </div>
              </div>
              <div id="winScreen" class="menu">
                <div class="winScreenContainer">
                  <div id="winTitle" class="CarChangeTitle">You Win</div>
                  <div class="LevelNum">Level 1</div>
                  <div class="winStarContainer">
                    <div class="star1">
                      <img height="70px" class="star" src="/images/Star Empty.png">
                      <div>Completed</div>
                    </div>
                    <div class="star2"><img height="120px" class="star" src="/images/Star Empty.png">
                      <div>Blocks</div>
                    </div>
                    <div class="star3"><img height="70px" class="star" src="/images/Star Empty.png">
                      <div>Time</div>
                    </div>
                    
                  </div>
                  <div class="NextLevelWinScreenContainer">
                    <button class="NextLevelButton">Next Level</button>
                    <button class="LevelSelectWinScreen"><img height="50px" src="/images/Level Selector Icon.png"></button>
                  </div>
                  <button class="ReturnButton">Return</button>
                </div>
              </div>
              </div>
            </div></div>
            
            <div class="canvasButtonsContainer">
                  <div class="NormalButtonsContainer"> <!--Normal Buttons-->
              <button id="carChangerButton" class="canvasButton">
                <img draggable="false" src="/images/Car Changer Icon.png">
              </button>

              <button id="levelSelectorButton" class="canvasButton">
                <img draggable="false" src="/images/Level Selector Icon.png">
              </button>

              <button id="lockView" class="canvasButton">
                <img draggable="false" src="/images/Lock Cam Icon.png">
              </button>
                  </div>

                  <div class="PlayButtonsContainer"><!--Play Buttons-->

                    <button id="playButton" class="canvasButton">
                        <img draggable="false"  src="/images/Play Icon.png">
                    </button>

                    <button id="restartButton" class="canvasButton">
                       <img draggable="false" src="/images/Restart Icon.png">
                    </button>
                  </div> 

            </div>
          </div>
        </div>
         
      </div>
      </div>
    <div class="blockCounter">Blocks: 0</div> 
    <template class="LevelModuleTemplate" id = "LevelModuleTemplate">
      <button class="LevelModule">
                    <div class="LevelModuleTitleNumContainer">
                      <div class="LevelModuleLvlNum">1</div>
                     <div class="LevelModuleTitle">Title</div> 
                    </div>
                    <div class="LevelModuleImgStarContainer">
                      <div class="LevelPreview">
                        <img src="/images/urban-rescue-logo.png"></img>
                      </div>
                      
                      <div class="starContainer">
                        <img src="/images/Star Empty.png">
                        <img src="/images/Star Empty.png">
                        <img src="/images/Star Empty.png">
                      </div>
                    </div>
                  </button>
    </template>
  </body> 

 
</html>
